services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: statuspulse
      POSTGRES_PASSWORD: statuspulse
      POSTGRES_DB: statuspulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statuspulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
